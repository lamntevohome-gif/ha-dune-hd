name: evoknx
description: EvoKNX – App điều khiển nhà thông minh KNX (Android, iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  evoknx_ui:
    path: ../../packages/evoknx_ui
  knx_core:
    path: ../../packages/knx_core
  knx_config:
    path: ../../packages/knx_config
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0
  wakelock_plus: ^1.2.8
  crypto: ^3.0.3
  # Camera RTSP: video playback (libmpv)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
